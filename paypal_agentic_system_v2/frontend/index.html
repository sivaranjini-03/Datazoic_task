<!doctype html><html><head><meta charset="utf-8"><title>PayPal Agentic AI</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}#chat{min-height:400px;border:1px solid #ddd;padding:16px;border-radius:10px}.u{margin:10px 0;font-weight:bold}.a{margin:10px 0 20px;white-space:pre-wrap}.row{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:12px}button{padding:12px 18px}</style></head><body><h1>PayPal Agentic AI</h1><div id="chat"></div><h3>Agent Trace</h3><pre id="trace">Send a request to see routing, retrieval, planning, validation and execution.</pre><div class="row"><input id="q" placeholder="Ask a PayPal question..."><button id="send">Send</button></div><script>const chat=document.getElementById('chat'),q=document.getElementById('q');let sid='web-demo';function add(c,t){let d=document.createElement('div');d.className=c;d.textContent=t;chat.appendChild(d)}async function send(){let m=q.value.trim();if(!m)return;add('u','You: '+m);q.value='';let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:m,confirmed:false})});let d=await r.json();add('a','Agent: '+d.answer);document.getElementById('trace').textContent=JSON.stringify(d.trace||[],null,2);if(d.status==='confirmation_required'){let b=document.createElement('button');b.textContent='Confirm';b.onclick=async()=>{let rr=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,message:m,confirmed:true})});let x=await rr.json();add('a','Agent: '+x.answer);document.getElementById('trace').textContent=JSON.stringify(x.trace||[],null,2);b.remove()};chat.appendChild(b)}}document.getElementById('send').onclick=send;q.addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>
